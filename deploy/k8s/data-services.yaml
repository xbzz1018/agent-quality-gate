apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-quality-harness
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: agent_quality}
            - {name: POSTGRES_USER, value: agent_quality}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aqh-secrets, key: postgres-password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, agent_quality, -d, agent_quality]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: agent-quality-harness}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: agent-quality-harness}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: agent-quality-harness}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: agent-quality-harness}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_CFG_NODE_ID, value: "0"}
            - {name: KAFKA_CFG_PROCESS_ROLES, value: controller,broker}
            - {name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka:9093"}
            - {name: KAFKA_CFG_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092"}
            - {name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
            - {name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: ALLOW_PLAINTEXT_LISTENER, value: "yes"}
          ports: [{containerPort: 9092}, {containerPort: 9093}]
          readinessProbe:
            exec:
              command: [sh, -c, "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /bitnami/kafka}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: agent-quality-harness}
spec:
  selector: {app: kafka}
  ports:
    - {name: broker, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: opa, namespace: agent-quality-harness}
spec:
  replicas: 1
  selector: {matchLabels: {app: opa}}
  template:
    metadata: {labels: {app: opa}}
    spec:
      containers:
        - name: opa
          image: agent-quality-gate-opa:local
          imagePullPolicy: IfNotPresent
          args: [run, --server, --addr=0.0.0.0:8181]
          ports: [{containerPort: 8181}]
          readinessProbe:
            httpGet: {path: /health, port: 8181}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: opa, namespace: agent-quality-harness}
spec:
  selector: {app: opa}
  ports: [{port: 8181, targetPort: 8181}]
