x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "-c", "alembic upgrade head && uvicorn agent_quality_harness.main:app --host 0.0.0.0 --port 8000"]
    environment: &app-environment
      AQH_DATABASE_URL: postgresql+psycopg://agent_quality:agent_quality@postgres:5432/agent_quality
      AQH_REDIS_URL: redis://redis:6379/0
      AQH_QUEUE_BACKEND: ${AQH_QUEUE_BACKEND:-redis}
      AQH_KAFKA_BOOTSTRAP_SERVERS: ${AQH_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      AQH_KAFKA_RUN_TOPIC: ${AQH_KAFKA_RUN_TOPIC:-aqh.eval-runs.v1}
      AQH_KAFKA_DLQ_TOPIC: ${AQH_KAFKA_DLQ_TOPIC:-aqh.eval-runs.dlq.v1}
      AQH_KAFKA_CONSUMER_GROUP: ${AQH_KAFKA_CONSUMER_GROUP:-agent-quality-harness-workers-v1}
      AQH_OTEL_ENABLED: ${AQH_OTEL_ENABLED:-false}
      AQH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AQH_JAEGER_BASE_URL: http://localhost:16686
      AQH_OPA_ENABLED: "true"
      AQH_OPA_URL: http://opa:8181
      AQH_DEMO_AGENT_ENDPOINT: http://fake-agent:8020/invoke
      AQH_AGRIGRAPH_AUTH: ${AQH_AGRIGRAPH_AUTH:-}
      AQH_DOCUMENT_AUTOFLOW_AUTH: ${AQH_DOCUMENT_AUTOFLOW_AUTH:-}
      AQH_JWT_SECRET: ${AQH_JWT_SECRET:-development-only-change-me-please-use-a-random-64-character-secret}
      AQH_REFRESH_COOKIE_SECURE: "false"
    ports:
      - "${AQH_API_PORT:-8000}:8000"
    mem_limit: 768m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "agent_quality_harness.worker"]
    environment: *app-environment
    mem_limit: 1536m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "agent_quality_harness.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy

  kafka-publisher:
    profiles: ["distributed"]
    build:
      context: .
      dockerfile: Dockerfile.kafka-publisher
    command: ["python", "-m", "agent_quality_harness.outbox_publisher"]
    environment: *app-environment
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "agent_quality_harness.kafka_health"]
      interval: 10s
      timeout: 8s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka-worker:
    profiles: ["distributed"]
    build:
      context: .
      dockerfile: Dockerfile.kafka-worker
    command: ["python", "-m", "agent_quality_harness.kafka_worker"]
    environment: *app-environment
    mem_limit: 1536m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "agent_quality_harness.kafka_health"]
      interval: 10s
      timeout: 8s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opa:
        condition: service_healthy

  opa:
    build:
      context: .
      dockerfile: Dockerfile.opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
    ports:
      - "${AQH_OPA_PORT:-8181}:8181"
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8181/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-agent:
    build:
      context: .
      dockerfile: Dockerfile.fake-agent
    command: ["uvicorn", "agent_quality_harness.fake_http_agent:app", "--host", "0.0.0.0", "--port", "8020"]
    ports:
      - "${AQH_FAKE_AGENT_PORT:-8020}:8020"
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-a2a:
    profiles: ["protocols"]
    build: .
    command: ["uvicorn", "agent_quality_harness.fake_agent:app", "--host", "0.0.0.0", "--port", "8020"]
    environment:
      AQH_FAKE_A2A_URL: http://fake-a2a:8020/a2a
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-mcp:
    profiles: ["protocols"]
    build: .
    command: ["uvicorn", "agent_quality_harness.fake_mcp:app", "--host", "0.0.0.0", "--port", "8030"]
    ports:
      - "${AQH_FAKE_MCP_PORT:-8031}:8030"
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8030/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  deep-agent:
    profiles: ["protocols"]
    build:
      context: .
      dockerfile: Dockerfile.deep-agent
    command: ["uvicorn", "agent_quality_harness.fake_deep_agent:app", "--host", "0.0.0.0", "--port", "8040"]
    ports:
      - "8040:8040"
    mem_limit: 768m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8040/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  fake-ag-ui:
    profiles: ["protocols"]
    build:
      context: .
      dockerfile: Dockerfile.fake-ag-ui
    command: ["uvicorn", "agent_quality_harness.fake_ag_ui:app", "--host", "0.0.0.0", "--port", "8050"]
    ports:
      - "8050:8050"
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
    ports:
      - "${AQH_WEB_PORT:-5174}:80"
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_started
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agent_quality
      POSTGRES_USER: agent_quality
      POSTGRES_PASSWORD: agent_quality
    ports:
      - "${AQH_POSTGRES_PORT:-5432}:5432"
    mem_limit: 768m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_quality -d agent_quality"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "${AQH_REDIS_PORT:-56379}:6379"
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["distributed"]
    image: bitnamilegacy/kafka@sha256:f45d5b813412e1ef7ce67b467309a84e4c6dc03d7626a0b6da867db9b69bd107
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "29092:29092"
    mem_limit: 1024m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "13133:13133"
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.73.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
      - "14269:14269"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
