name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_quality
          POSTGRES_USER: agent_quality
          POSTGRES_PASSWORD: agent_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AQH_DATABASE_URL: postgresql+psycopg://agent_quality:agent_quality@localhost:5432/agent_quality
      AQH_REDIS_URL: redis://localhost:6379/0
      AQH_RUN_INTEGRATION: "1"
      AQH_CODE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Start OPA 1.17.0
        run: >-
          docker run -d --name aqh-opa -p 8181:8181
          openpolicyagent/opa:1.17.0 run --server --addr=0.0.0.0:8181
          --set=decision_logs.console=true
      - name: Wait for OPA readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8181/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs aqh-opa
          exit 1
      - run: python -m ruff check .
      - run: python -m alembic upgrade head
      - run: python -m pytest
      - run: python -m alembic check
      - run: aqh gate --report tests/fixtures/gate-ship.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
